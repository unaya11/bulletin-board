permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

name: bulletin-board-test

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    name: Run tests on Self-Hosted Runner
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      #      - name: Grant execute permission for gradlew
      #        run: chmod +x ./gradlew
      - name: Make gradlew executable (Linux only)
        if: runner.os == 'Linux'
        run: chmod +x ./gradlew

      - name: Delete workspace build dirs
        run: rm -rf $GITHUB_WORKSPACE/build

      - name: Delete Gradle cache
        run: rm -rf ~/.gradle/caches

      - name: Run unit tests
        run: ./gradlew clean test --no-build-cache --rerun-tasks

      # テストレポートをHTML形式で生成（ただし容量節約のため、上書き保存）
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: build/reports/tests/test/


      # PRのコメントにレポートのダウンロードリンクが記載のページへのリンクを追加
      - name: Comment artifact link on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const pr = context.payload.pull_request?.number;
            if (pr) {
            const runId = process.env.GITHUB_RUN_ID;
            const artifactUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;
            github.rest.issues.createComment({
                issue_number: pr,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `📝 [テストレポートはこちらからダウンロードおよびindex.htmlから閲覧可能です](${artifactUrl})`
            });
            }
      - name: Find test results
        run: find . -name "*.xml" | grep test-results
      # Gradleのテスト結果(XML)を読み取ってActionsのSummaryに表示する
      - name: Test Summary (Alternative)
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          # find の結果に合わせて、より広く確実に指定
          files: "build/test-results/test/*.xml"
