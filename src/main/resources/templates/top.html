<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <link th:href="@{/style.css}" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>掲示板</title>
</head>
<body>
<div class="container">
    <header>
        <h1>
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            掲示板
        </h1>
        <p class="header-description">自由に投稿・閲覧できるシンプルな掲示板です</p>
    </header>

    <div id="notification"></div>

    <div class="card">
        <h2 class="section-title">新規投稿</h2>
        <form action="top" method="post"  id="messageForm">
            <div class="form-group">
                <label for="name">名前</label>
                <input type="text" id="name" name="name" placeholder="あなたの名前" required>
            </div>
            <div class="form-group">
                <label for="title">タイトル</label>
                <input type="text" id="title" name="title" placeholder="投稿のタイトル" required>
            </div>
            <div class="form-group">
                <label for="message">内容</label>
                <textarea id="message" name="message" placeholder="メッセージを入力してください" required></textarea>
            </div>
            <button type="submit">投稿する</button>
        </form>
    </div>

    <section>
        <h2 class="section-title">投稿一覧 (<span id="messageCount" th:text="${message.size()}"></span>件)</h2>
        <div id="messageList" th:each="msg : ${message}" class="card">
            <div class="message-header">
                <h3 class="message-title" th:text="${msg.title}"></h3>
                <span class="message-meta" th:text="${msg.user.name}"></span>
            </div>
            <p class="message-content" th:text="${msg.message}"></p>
            <span class="message-time" th:text="${#temporals.format(msg.createdAt, 'yyyy/MM/dd HH:mm:ss')}"></span>
            <span class="message-time">
                <a th:href="@{reply/{id}(id=${msg.messageId})}" th:text="'返信(' + ${msg.replies.size()} + '件)'"></a>
            </span>
        </div>
    </section>
</div>
</body>
</html>
